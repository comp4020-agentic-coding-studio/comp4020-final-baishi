# esbuild (used by Vitest) needs its postinstall to set up its native binary.
# better-sqlite3 ships prebuilt binaries in prebuilds/, which it loads ahead of
# anything built locally; allowing its build only triggers an implicit
# `node-gyp rebuild` that needs Python and a compiler the image doesn't have.
allowBuilds:
  better-sqlite3: false
  esbuild: true
